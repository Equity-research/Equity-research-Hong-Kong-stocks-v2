version: 2
scale: 10
dimensions:
  cornerstone_presence:
    label: 基石投资者
    weight: 1
    metric: has_cornerstone
  cornerstone_quality:
    label: 基石质量
    weight: 1
    metric: cornerstone_quality_good
    requires: has_cornerstone
  greenshoe:
    label: 绿鞋机制
    weight: 1
    metric: greenshoe
  subscription:
    label: 公开申购倍数
    weight: 3
    metric: subscription_multiple
    bands:
      - {min: 100, score: 3}
      - {min: 50, score: 2}
      - {min: 10, score: 1}
      - {min: 0, score: 0}
  valuation:
    label: 估值吸引力
    weight: 3
    ah_metric: ah_premium
    peer_metric: peer_valuation_discount
    ah_bands:
      - {greater_than: 70, score: 3}
      - {greater_than: 50, score: 2}
      - {greater_than: 30, score: 1}
      - {greater_than: -1000000, score: 0}
    peer_bands:
      - {greater_than: 30, score: 3}
      - {min: 10, score: 2}
      - {min: 0, score: 1}
      - {min: -1000000, score: 0}
  sponsor:
    label: 保荐人及历史表现
    weight: 1
    metric: sponsor_quality_good
recommendations:
  buy: {min: 8, label: 申购}
  hold: {min: 4, label: 观望}
  avoid: {min: 0, label: 回避}
adjustment:
  min: -1
  max: 1
  reason_min_length: 10
